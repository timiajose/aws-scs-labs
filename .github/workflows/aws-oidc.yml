name: aws-oidc-test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the OIDC claims GitHub is sending
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2)
          P="${P}$(printf '=%.0s' $(seq $(( (4 - ${#P} % 4) % 4 ))))"
          echo "$P" | tr '_-' '/+' | base64 -d | jq '{iss, aud, sub, repository, ref, workflow_ref}'

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::797273591655:role/GitHubDeployRole
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-2

      - name: Who am I in AWS?
        run: aws sts get-caller-identity
