name: governed-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Gate 1 + 2: template validity and org policy rules. No AWS access.
  # ---------------------------------------------------------------
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cfn-lint
        run: pipx install 'cfn-lint==1.57.2'

      - name: Install cfn-guard
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/814bd00a4e6d761e8b5c9f615dd510b1a2a7c374/install-guard.sh \
            -o /tmp/install-guard.sh
          sh /tmp/install-guard.sh
          echo "$HOME/.guard/bin" >> "$GITHUB_PATH"

      # Attacker-controlled input (PR titles, branch names, commit messages) must
      # never be interpolated directly into a run: block - GitHub substitutes the
      # text into the script BEFORE the shell parses it, so data becomes code.
      # Passing it through env: keeps the script fixed and the value a single string.
      - name: Context (parameterized - safe)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: echo "Validating PR by $PR_AUTHOR - $PR_TITLE"

      - name: cfn-lint (is the template valid CloudFormation?)
        run: cfn-lint week-03/pipeline/template.yaml

      - name: cfn-guard (does it meet our org rules?)
        run: |
          cfn-guard validate \
            --data week-03/pipeline/template.yaml \
            --rules week-03/pipeline/rules.guard \
            --show-summary pass,fail

  # ---------------------------------------------------------------
  # Gate 3: IAM policy linting. Pull requests only, read-only role.
  # ---------------------------------------------------------------
  policy-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the READ-ONLY validate role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::797273591655:role/GitHubValidateRole
          role-session-name: gha-validate-${{ github.run_id }}
          aws-region: us-east-2

      - name: Access Analyzer validate-policy
        run: |
          fail=0
          for f in week-03/pipeline/iam-policies/*.json; do
            echo "::group::$f"
            out=$(aws accessanalyzer validate-policy \
                    --policy-document "file://$f" \
                    --policy-type IDENTITY_POLICY \
                    --query 'findings[?findingType==`ERROR` || findingType==`SECURITY_WARNING`]' \
                    --output json)
            echo "$out"
            if [ "$out" != "[]" ]; then
              echo "::error file=$f::ERROR or SECURITY_WARNING findings in $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # ---------------------------------------------------------------
  # Deploy: main branch only, after the gates pass.
  # ---------------------------------------------------------------
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the DEPLOY role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::797273591655:role/GitHubDeployRole
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: us-east-2

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Deploy the stack
        run: |
          aws cloudformation deploy \
            --template-file week-03/pipeline/template.yaml \
            --stack-name scs-week3-app-role \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show what was created
        run: |
          aws cloudformation describe-stacks --stack-name scs-week3-app-role \
            --query 'Stacks[0].[StackName,StackStatus]' --output text
          aws iam get-role --role-name app-ingest-role \
            --query 'Role.[RoleName,PermissionsBoundary.PermissionsBoundaryArn]' --output text
